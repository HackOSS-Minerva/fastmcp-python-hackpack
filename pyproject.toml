[project]
name = "fastmcp-python-hackpack"
version = "0.1.0"
description = "A FastMCP weather server starter using the National Weather Service API"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastmcp>=3,<4",
    "httpx>=0.28,<1",
]

[project.scripts]
weather = "weather.main:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "weather"
namespace = true

[dependency-groups]
dev = ["ruff>=0.16.9"]
